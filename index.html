<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oasis Outreach</title>
<meta name="theme-color" content="#0D0C0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Outreach">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=Poppins:wght@200;300&display=swap" rel="stylesheet">
<style>
  /* baraanoura.com design tokens (dark theme) */
  :root {
    --bg:#0D0C0B; --surface:#171512; --ink:#F4EEE4; --muted:#B8AE9F;
    --sage:#AFC2AB; --sage-btn:#C3CFBE; --line:#2A2621; --box:#3F4B43;
    --body:"Jost","Futura","Avenir Next","Segoe UI",sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-weight:300; font-size:14px; line-height:1.5; }
  .wrap { max-width:440px; margin:0 auto; padding:22px 18px 26px; }

  /* Logo lockup — same SVG as the site header */
  .logo { color:var(--sage); line-height:0; text-align:center; }
  .logo svg { width:170px; height:auto; overflow:visible; }
  .lg-big { font-family:"Poppins",var(--body); font-weight:200; font-size:70px; fill:currentColor; }
  .lg-small { font-family:"Poppins",var(--body); font-weight:300; font-size:15px; letter-spacing:9px; fill:currentColor; }
  .lg-a { fill:none; stroke:currentColor; stroke-width:2.8; stroke-linejoin:miter; stroke-linecap:butt; }
  .lg-swoosh { fill:currentColor; }

  .eye { font-size:10.5px; font-weight:400; letter-spacing:.32em; text-transform:uppercase; color:var(--sage); }
  .title { text-align:center; margin:14px 0 18px; }
  .rule { width:48px; height:1px; background:var(--sage); margin:10px auto 0; opacity:.7; }

  /* Progress */
  .prog { border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:14px 0; margin-bottom:18px; }
  .prog-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .prog-top .count { font-size:15px; font-weight:400; }
  .track { height:3px; background:var(--line); border-radius:3px; overflow:hidden; }
  .track i { display:block; height:100%; width:0; background:var(--sage); transition:width .3s; }
  .sub { display:flex; justify-content:space-between; margin-top:9px; font-size:12.5px; color:var(--muted); }
  .sub b { color:var(--ink); font-weight:400; }

  /* Owner card */
  .card { background:var(--surface); border:1px solid var(--box); border-radius:12px; overflow:hidden; margin-bottom:16px; }
  .card-head { padding:14px 16px 12px; border-bottom:1px solid var(--line); }
  .tag { display:inline-block; font-size:10px; font-weight:400; letter-spacing:.24em; text-transform:uppercase;
         color:var(--sage); border:1px solid var(--box); border-radius:12px; padding:3px 10px; margin-bottom:9px; }
  .tag.follow { color:var(--bg); background:var(--sage-btn); border-color:var(--sage-btn); }
  .name { font-size:19px; font-weight:300; line-height:1.25; word-break:break-word; }
  .details { padding:8px 16px 12px; }
  .kv { display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .kv:last-child { border-bottom:0; }
  .kv span:first-child { color:var(--muted); font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; padding-top:2px; }
  .kv span:last-child { font-weight:400; text-align:right; word-break:break-word; }
  .kv a { color:var(--sage); text-decoration:none; }

  /* Message */
  .msg-label { margin:0 0 8px; }
  textarea { width:100%; height:250px; padding:12px 13px; font:inherit; font-size:13.5px; line-height:1.55; color:var(--ink);
             background:var(--surface); border:1px solid var(--box); border-radius:12px; resize:vertical; }
  textarea:focus { outline:none; border-color:var(--sage); }

  /* Buttons — site .btn style */
  .btn { display:flex; align-items:center; justify-content:center; width:100%; min-height:46px; padding:0 18px; margin-top:14px;
         border-radius:12px; border:1px solid transparent; cursor:pointer; font:400 12px var(--body); letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; }
  .btn-solid { background:var(--sage-btn); color:#161514; }
  .btn-solid:hover { background:var(--sage); }
  .btn-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .btn-line { background:transparent; color:var(--ink); border-color:var(--box); margin-top:10px; font-size:12.5px; letter-spacing:.04em; text-transform:none; min-height:40px; padding:0 8px; }
  .btn-line:hover { border-color:var(--sage); color:var(--sage); }


  /* Tabs */
  .tabs { display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--box); border-radius:12px; overflow:hidden; margin-bottom:16px; }
  .tabs button { background:transparent; border:0; color:var(--muted); font:400 11px var(--body); letter-spacing:.18em; text-transform:uppercase; padding:10px 6px; cursor:pointer; }
  .tabs button.on { background:var(--sage-btn); color:#161514; }

  /* List view */
  .filters { display:grid; grid-template-columns:1fr; gap:8px; margin-bottom:12px; }
  select, input.search { width:100%; padding:9px 12px; font:inherit; font-size:13px; color:var(--ink); background:var(--surface);
           border:1px solid var(--box); border-radius:12px; }
  select:focus, input.search:focus { outline:none; border-color:var(--sage); }
  .list { border-top:1px solid var(--line); }
  .li { border-bottom:1px solid var(--line); }
  .li-row { display:flex; align-items:center; gap:10px; padding:11px 0; }
  .li-main { flex:1; min-width:0; cursor:pointer; }
  .li-name { font-size:14px; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .li-meta { font-size:12px; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .li-meta .fu { color:var(--sage); }
  .mini { flex:none; width:100px; min-width:100px; white-space:nowrap; overflow:hidden; height:32px; padding:0 12px; border-radius:12px; border:1px solid transparent; cursor:pointer;
          background:var(--sage-btn); color:#161514; font:400 11px var(--body); letter-spacing:.12em; text-transform:uppercase; }
  .mini:hover { background:var(--sage); }
  .mini.done { background:transparent; border-color:var(--box); color:var(--sage); cursor:default; }
  .mini:disabled:not(.done) { opacity:.4; cursor:default; }
  .li-msg { display:none; white-space:pre-wrap; font-size:12.5px; line-height:1.5; color:var(--muted); background:var(--surface);
            border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:0 0 12px; }
  .li.open .li-msg { display:block; }
  .li.sent .li-name { color:var(--muted); }
  .list-note { font-size:12px; color:var(--muted); text-align:center; margin-top:12px; }

  /* Villa Finder filters */
  .fbar { display:flex; gap:8px; margin-bottom:10px; }
  .fbar input.search { flex:1; }
  .fbtn { flex:none; padding:0 14px; border-radius:12px; border:1px solid var(--box); background:transparent; color:var(--ink);
          font:400 11px var(--body); letter-spacing:.14em; text-transform:uppercase; cursor:pointer; }
  .fbtn.on { border-color:var(--sage); color:var(--sage); }
  .fpanel { display:none; background:var(--surface); border:1px solid var(--box); border-radius:12px; padding:12px; margin-bottom:12px; }
  .fpanel.open { display:block; }
  .fgrid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
  .fgrid > div { min-width:0; }
  .fgrid .full { grid-column:1 / -1; }
  .fgrid label.fl { display:block; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .fgrid select, .fgrid input { width:100%; min-width:0; padding:8px 10px; font:inherit; font-size:12.5px; color:var(--ink); background:var(--bg); border:1px solid var(--box); border-radius:12px; }
  .fgrid input:focus { outline:none; border-color:var(--sage); }
  .ms { position:relative; }
  .ms-btn { width:100%; min-width:0; padding:8px 26px 8px 10px; font:inherit; font-size:12.5px; color:var(--ink); background:var(--bg); border:1px solid var(--box);
            border-radius:12px; text-align:left; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; position:relative; }
  .ms-btn::after { content:'▾'; position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:10px; color:var(--muted); }
  .ms-btn.on { border-color:var(--sage); color:var(--sage); }
  .ms-list { display:none; position:absolute; z-index:20; left:0; right:0; top:calc(100% + 4px); max-height:260px; overflow:auto;
             background:var(--surface); border:1px solid var(--box); border-radius:12px; padding:4px 0; box-shadow:0 10px 30px rgba(0,0,0,.45); min-width:170px; }
  .ms.open .ms-list { display:block; }
  .ms-list label { display:flex; align-items:center; gap:10px; padding:9px 12px; font-size:13px; color:var(--ink); cursor:pointer; }
  .ms-list label:hover { background:rgba(255,255,255,.03); }
  .ms-list input { accent-color:#AFC2AB; width:16px; height:16px; margin:0; flex:none; }
  .ms-foot { display:flex; justify-content:space-between; border-top:1px solid var(--line); margin-top:4px; }
  .ms-foot a { padding:10px 12px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--sage); cursor:pointer; }
  .dirs { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
  .dirs label { display:block; cursor:pointer; }
  .dirs input { display:none; }
  .dirs span { display:block; text-align:center; padding:6px 0; border:1px solid var(--box); border-radius:12px; font-size:12px; color:var(--muted); }
  .dirs input:checked + span { background:var(--sage-btn); border-color:var(--sage-btn); color:#161514; }
  .factions { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; margin-top:14px; }
  .factions .btn { margin-top:0; min-height:40px; }
  .matched { font-size:12px; color:var(--muted); margin:0 0 8px; }
  .matched b { color:var(--ink); font-weight:400; }
  .li-spec { font-size:11.5px; color:var(--muted); opacity:.85; line-height:1.4; margin-top:1px; }

  /* Two send buttons */
  .send-row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; margin-top:14px; }
  .send-row .btn { margin-top:0; }
  .btn-mail { background:transparent; color:var(--sage); border-color:var(--sage); }
  .btn-mail:hover { background:var(--surface); }
  .btn:disabled { opacity:.4; cursor:default; }
  .btn.done { background:transparent; color:var(--sage); border-color:var(--box); opacity:1; }
  .mini-col { flex:none; display:flex; flex-direction:column; gap:6px; }
  .mini.mail { background:transparent; color:var(--sage); border-color:var(--sage); }
  .mini.mail:hover { background:var(--surface); }
  .mini.again { background:transparent; color:var(--sage); border-color:var(--box); }
  .mini.again:hover { border-color:var(--sage); background:var(--surface); }
  .btn.again { background:transparent; color:var(--sage); border-color:var(--box); }
  .mini.off { background:transparent; border-color:var(--line); color:var(--muted); opacity:.55; cursor:default; }

  /* Phone: bigger tap targets */
  @media (max-width:520px) {
    .mini { height:40px; width:112px; min-width:112px; font-size:11.5px; }
    .btn { min-height:50px; }
    .tabs button { padding:13px 6px; }
    .li-row { padding:13px 0; }
  }

  .refresh { margin-left:8px; color:var(--muted); cursor:pointer; letter-spacing:.12em; text-decoration:none; }
  .refresh:hover { color:var(--sage); }

  /* DND warning */
  .dnd { display:inline-block; background:#C8473D; color:#fff; font-weight:500; font-size:10px; letter-spacing:.18em;
         text-transform:uppercase; padding:2px 8px; border-radius:12px; margin-right:6px; vertical-align:2px; }
  .dnd-note { background:rgba(200,71,61,.12); border:1px solid #C8473D; color:#F0A69F; border-radius:12px;
              padding:10px 12px; font-size:12.5px; margin:0 0 12px; }
  .dnd-note b { color:#fff; font-weight:500; letter-spacing:.12em; }
  .li.is-dnd .li-name { color:#F0A69F; }

  /* Three tabs */
  .tabs.three { grid-template-columns:repeat(3, minmax(0,1fr)); }

  /* Owner tools: status chips, replied, call, notes */
  .tools { margin-top:14px; }
  .chips2 { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 12px; }
  .chip2 { padding:6px 10px; border-radius:12px; border:1px solid var(--box); background:transparent; color:var(--muted);
           font:400 10.5px var(--body); letter-spacing:.12em; text-transform:uppercase; cursor:pointer; }
  .chip2:hover { border-color:var(--sage); color:var(--sage); }
  .chip2.on { background:var(--sage-btn); border-color:var(--sage-btn); color:#161514; }
  .chip2.dndc.on { background:#C8473D; border-color:#C8473D; color:#fff; }
  .tool-row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; margin-bottom:10px; }
  .tool-row .btn { margin-top:0; min-height:40px; font-size:11.5px; }
  .btn.replied { background:var(--sage-btn); color:#161514; border-color:var(--sage-btn); }
  .note { width:100%; height:64px; padding:9px 11px; font:inherit; font-size:12.5px; color:var(--ink); background:var(--bg);
          border:1px solid var(--box); border-radius:12px; resize:vertical; }
  .note:focus { outline:none; border-color:var(--sage); }
  .note-row { display:flex; gap:8px; align-items:flex-start; }
  .ask-in { flex:1; min-width:0; padding:9px 12px; font:inherit; font-size:14px; color:var(--ink); background:var(--bg); border:1px solid var(--box); border-radius:12px; }
  .ask-in:focus { outline:none; border-color:var(--sage); }
  .note-row .btn { width:auto; margin-top:0; min-height:36px; padding:0 14px; font-size:11px; }
  .units { font-size:12px; color:var(--muted); margin-top:4px; line-height:1.45; }
  .units b { color:var(--ink); font-weight:400; }
  .badge2 { display:inline-block; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--sage);
            border:1px solid var(--box); border-radius:12px; padding:1px 7px; margin-left:6px; vertical-align:2px; }
  .li-panel { display:none; padding:0 0 14px; }
  .li.open .li-panel { display:block; }
  .li-panel .li-msg { display:block; }

  /* Results */
  .kpis { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin-bottom:16px; }
  .kpi { background:var(--surface); border:1px solid var(--box); border-radius:12px; padding:12px 8px; text-align:center; }
  .kpi b { display:block; font-size:22px; font-weight:300; color:var(--ink); }
  .kpi span { font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .rsec { margin:18px 0 8px; }
  .bars { display:flex; align-items:flex-end; gap:3px; height:90px; border-bottom:1px solid var(--line); }
  .bars div { flex:1; background:var(--sage); border-radius:3px 3px 0 0; min-height:1px; position:relative; }
  .bars div.em { background:transparent; border:1px solid var(--sage); border-bottom:0; }
  .bars-x { display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted); margin-top:4px; }
  .rtable { width:100%; border-collapse:collapse; font-size:12.5px; }
  .rtable td { padding:7px 0; border-bottom:1px solid var(--line); }
  .rtable td:nth-child(2), .rtable td:nth-child(3) { text-align:right; color:var(--muted); white-space:nowrap; padding-left:8px; }
  .rtable td:nth-child(3) b { color:var(--ink); font-weight:400; }
  .rbar { height:3px; background:var(--line); border-radius:3px; margin-top:4px; overflow:hidden; }
  .rbar i { display:block; height:100%; background:var(--sage); }
  .legend { display:flex; gap:14px; font-size:11px; color:var(--muted); margin-top:8px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; background:var(--sage); }
  .legend i.em { background:transparent; border:1px solid var(--sage); }

  a.mini { display:flex; align-items:center; justify-content:center; text-decoration:none; box-sizing:border-box; }
  .mini.call { background:transparent; color:var(--ink); border-color:var(--box); }
  .mini.call:hover { border-color:var(--sage); color:var(--sage); }
  .msg-edit { width:100%; height:190px; margin:0 0 4px; padding:10px 12px; font:inherit; font-size:12.5px; line-height:1.5; color:var(--ink);
              background:var(--surface); border:1px solid var(--box); border-radius:12px; resize:vertical; }
  .msg-edit:focus { outline:none; border-color:var(--sage); }
  .panel-details a { color:var(--sage); cursor:pointer; text-decoration:none; }
  .panel-details { background:var(--surface); border:1px solid var(--box); border-radius:12px; padding:4px 12px; margin-bottom:12px; }
  .q-head { display:flex; justify-content:space-between; align-items:baseline; margin:0 0 8px; }

  /* Compact action row under each owner */
  .act-row { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:6px; margin-top:9px; }
  .emaar { display:inline-block; margin-right:7px; padding:1px 7px; border-radius:8px; border:1px solid var(--muted); color:var(--muted); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; vertical-align:2px; }
  .step-row { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:6px; margin-top:6px; }
  .step-row .dots { display:flex; justify-content:center; gap:8px; }
  .dot { width:24px; height:24px; border-radius:50%; border:1px solid var(--box); background:transparent; color:var(--muted);
         font:400 11px var(--body); display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer; }
  .dot:hover { border-color:var(--sage); color:var(--sage); }
  .dot.next { border-color:var(--sage); color:var(--sage); }
  .dot.done { background:var(--sage-btn); border-color:var(--sage-btn); color:#161514; }
  .dot:disabled { opacity:.4; cursor:default; }
  @media (max-width:520px) { .dot { width:28px; height:28px; font-size:12px; } }
  .act-row .mini { width:auto; min-width:0; height:30px; font-size:10.5px; letter-spacing:.06em; padding:0 4px; text-overflow:clip; }
  .li-row { display:block; }
  .unit-no { }
  .owns { display:inline-block; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--sage); border:1px solid var(--box); border-radius:12px; padding:1px 7px; margin-left:6px; vertical-align:1px; }
  @media (max-width:520px) { .act-row .mini { height:36px; width:auto; min-width:0; font-size:10.5px; } }
  @media (max-width:340px) { .act-row .mini { letter-spacing:.03em; font-size:10px; } }

  /* Four tabs */
  .tabs.four { grid-template-columns:repeat(4, minmax(0,1fr)); }
  .tabs.four button { font-size:10px; letter-spacing:.12em; padding:11px 2px; }
  .tabs.five { grid-template-columns:repeat(5, minmax(0,1fr)); }
  .tabs.seven { display:flex; flex-wrap:wrap; }
  .tabs.seven button { flex:1 1 25%; font-size:10px; letter-spacing:.1em; padding:11px 2px; white-space:nowrap; }
  .tabs.seven button { flex-basis:33%; }
  .tabs.seven button:nth-child(n+4) { border-top:1px solid var(--box); }
  .tcount { display:inline-block; min-width:16px; margin-left:5px; padding:0 4px; border-radius:8px; background:#C8473D; color:#fff; font-size:9px; letter-spacing:0; line-height:15px; }
  .tcount:empty { display:none; }
  .seg { display:flex; border:1px solid var(--box); border-radius:12px; overflow:hidden; margin-bottom:16px; }
  .seg button { flex:1; background:transparent; border:0; color:var(--muted); font:400 10.5px var(--body); letter-spacing:.16em; text-transform:uppercase; padding:9px 4px; cursor:pointer; }
  .seg button.on { background:var(--surface); color:var(--sage); }
  .lead { padding:14px 2px; border-top:1px solid var(--line); }
  .lead .ln { font-size:15px; color:var(--ink); }
  .lead .lm { font-size:12px; color:var(--muted); margin-top:2px; }
  .lead .ld { font-size:12.5px; color:var(--ink); opacity:.85; margin-top:6px; white-space:pre-wrap; }
  .lead .lb { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; }
  .lead .lb .mini { width:100%; min-width:0; height:36px; font-size:10.5px; letter-spacing:.06em; }
  .lead .lb .mini.off { grid-column:1 / -1; }
  #leadsView .list-note a, #docsPane .list-note a { color:var(--sage); cursor:pointer; }
  .lead .ls { gap:6px; margin-top:8px; flex-wrap:wrap; }
  .lead.st-Done .ln { color:var(--muted); }
  .new-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#C8473D; margin-right:7px; vertical-align:2px; }
  .doc { display:flex; align-items:center; gap:12px; padding:12px 2px; border-top:1px solid var(--line); }

<script>
/* Oasis valuation report — shared by the sidebar (browser) and the sample builder (node).
 * Style follows the baraanoura.com PDF reports: black background, Jost, sage accents, logo. */
(function (root) {

  /* ---------- Comparable sales ---------- */
  function key(n) {
    return String(n || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
      .replace(/\b(villas?|the)\b/g, '').replace(/\s+/g, ' ').trim();
  }
  function num(v) { var n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.]/g, '')); return isNaN(n) ? null : n; }
  function monthsBack(iso, m) {
    var a = iso.split('-').map(Number), d = new Date(Date.UTC(a[0], a[1] - 1 - m, a[2]));
    return d.toISOString().slice(0, 10);
  }
  function median(a) { a = a.slice().sort(function (x, y) { return x - y; }); var n = a.length; return !n ? 0 : n % 2 ? a[(n - 1) / 2] : (a[n / 2 - 1] + a[n / 2]) / 2; }

  /**
   * sales: {c:[cluster names], s:[[date, clusterIdx, price, plot, bua, beds], ...]} (baraanoura.com/data/sales-archive.json)
   * unit:  {cluster, beds, bua}
   * Picks up to `max` comparable sales: same cluster + same bedrooms in the last 6 months,
   * widening to 12 months, then any time, then same bedrooms in any cluster.
   */
  function pickComps(sales, unit, max) {
    max = max || 6;
    var ci = sales.c.map(key).indexOf(key(unit.cluster));
    var beds = num(unit.beds), latest = sales.s.reduce(function (m, r) { return r[0] > m ? r[0] : m; }, '');
    var all = sales.s.map(function (r) { return { date: r[0], cl: sales.c[r[1]], ci: r[1], price: r[2], plot: r[3], bua: r[4], beds: r[5] }; })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var steps = [
      { label: 'same cluster and bedrooms, last 6 months', f: function (s) { return s.ci === ci && s.beds === beds && s.date >= monthsBack(latest, 6); } },
      { label: 'same cluster and bedrooms, last 12 months', f: function (s) { return s.ci === ci && s.beds === beds && s.date >= monthsBack(latest, 12); } },
      { label: 'same cluster and bedrooms', f: function (s) { return s.ci === ci && s.beds === beds; } },
      { label: 'same cluster', f: function (s) { return s.ci === ci; } },
      { label: 'same bedrooms across The Oasis, last 6 months', f: function (s) { return s.beds === beds && s.date >= monthsBack(latest, 6); } },

    return /M$/.test(t) || n < 1000 ? n * 1e6 : (/K$/.test(t) ? n * 1e3 : n);
  }
  function openValuation(g, id) {
    var box = $('val_' + id); if (!box) return;
    if (box.innerHTML) { box.innerHTML = ''; return; }            // tap again to close
    box.innerHTML = '<div class="val-box"><div class="val-sum">Loading the latest sales from baraanoura.com…</div></div>';
    valData().then(function (d) {
      var V = window.OasisValuation, u = unitOf(g);
      var pc = V.pickComps(d.sales, u, 6), sg = V.suggest(pc.comps, u.bua), mk = V.snapshot(d.sales, u.cluster, d.construction);
      g._val = { u: u, pc: pc, mk: mk };
      box.innerHTML = '<div class="val-box">' +
        '<div class="val-sum"><b>' + pc.comps.length + '</b> comparable sales (' + esc(pc.basis) + ')' +
          (sg.psf ? ' · median <b>AED ' + V.fmt(sg.psf) + '</b> per sq ft' : '') +
          '<br>Suggested: <b>' + V.mil(sg.low) + ' – ' + V.mil(sg.high).replace('AED ', '') + '</b></div>' +
        '<div class="val-grid"><div><label>Low (AED)</label><input id="vlo_' + id + '" value="' + (sg.low / 1e6).toFixed(2) + 'M"></div>' +
          '<div><label>High (AED)</label><input id="vhi_' + id + '" value="' + (sg.high / 1e6).toFixed(2) + 'M"></div></div>' +
        '<label class="fl">Villa highlights (edit if needed)</label>' +
        '<textarea id="vnote_' + id + '">' + esc(V.autoNote(u, pc.comps, mk)) + '</textarea>' +
        '<button class="btn btn-solid" id="vbtn_' + id + '" onclick="makeValuation(\'' + id + '\')">Create PDF</button>' +
        '<div id="vout_' + id + '"></div></div>';
    }).catch(function (e) { box.innerHTML = '<div class="val-box"><div class="val-sum">Could not load the sales data: ' + esc(e.message || e) + '</div></div>'; });
  }
  function makeValuation(id) {
    var g = groupById(id), v = g && g._val; if (!v) return;
    var lo = parseAED($('vlo_' + id).value), hi = parseAED($('vhi_' + id).value);
    if (!lo || !hi || hi < lo) { toast('Check the Low and High values'); return; }
    if (!window.jspdf) { toast('PDF engine still loading, try again in a second'); return; }
    var btn = $('vbtn_' + id); btn.disabled = true; btn.textContent = 'Creating…';
    function fail2(e) { btn.disabled = false; btn.textContent = 'Create PDF'; toast('Report not created: ' + (e.message || e)); }
    try {
      var J = window.OasisValuation.build(window.jspdf.jsPDF, VD.assets, {
        owner: g.n, unit: v.u, low: lo, high: hi, comps: v.pc.comps, basis: v.pc.basis, market: v.mk, note: $('vnote_' + id).value.trim() });
      var b64 = J.output('datauristring').split(',')[1];
      var file = 'Valuation - ' + v.u.cluster + ' Villa ' + v.u.unit + ' - ' + new Date().toISOString().slice(0, 10) + '.pdf';
      google.script.run.withSuccessHandler(function (saved) {
        google.script.run.withSuccessHandler(function (sh) {
          btn.disabled = false; btn.textContent = 'Create Again';
          var link = sh.url, first = g.f || 'there';
          var wa = 'Hi ' + first + ', this is Baraa, The Oasis Specialist.\nHere is a valuation report I prepared for villa ' + v.u.unit + ' in ' + v.u.cluster + ':\n' + link +
                   '\n\nHappy to talk it through anytime.\n\nThanks,\nBaraa';
          var subj = 'Valuation Report: Villa ' + v.u.unit + ' in ' + v.u.cluster;
          var body = 'Dear ' + (g.f || 'Sir or Madam') + ',\n\nPlease find the valuation report for villa ' + v.u.unit + ' in ' + v.u.cluster + ' here:\n' + link +
                     '\n\nI would be happy to talk it through at your convenience.\n\n' + T.emailSignoff;
          $('vout_' + id).innerHTML = '<div class="val-done">' +
            '<a class="pri" href="' + esc(saved.url) + '" target="_blank">Open PDF</a>' +
            (g.p ? '<a href="' + esc(waUrl(g.p, wa)) + '" target="_blank">WhatsApp</a>' : '<a style="opacity:.4">No WA</a>') +
            (g.e ? '<a href="' + esc('mailto:' + g.e + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(body)) + '" target="_blank">Email</a>' : '<a style="opacity:.4">No Email</a>') +
            '</div><div class="list-note" style="margin-top:8px">Saved in Google Drive → Valuation Reports. Anyone with the link can view it.</div>';
          toast('✓ Valuation report created · ' + g.n);
        }).withFailureHandler(fail2).shareValuationPdf(saved.id);
      }).withFailureHandler(fail2).saveValuationPdf(b64, file, g.rows[0].r);
    } catch (e) { fail2(e); }
  }

  /* ---------- Results ---------- */
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  function drawResults() {
    if (!loaded) return;
    var contacted = 0, replied = 0, waC = 0, emC = 0, byT = {}, byC = {};
    var TL = { palmiera: 'Palmiera 1–3', other: 'Other clusters', available: 'Sale / Distress', valuation: 'Not Selling check-in', handover: 'Handover support', 'follow-up': 'Follow-up', final: 'Message 3' };
    G.forEach(function (g) {
      var wa = g.rows.some(function (o) { return o.wd; }), em = g.em;
      if (!wa && !em) return;
      contacted++; if (wa) waC++; if (em) emC++; if (g.rp) replied++;
      var t = g.wt || g.k; (byT[t] = byT[t] || [0, 0])[0]++; if (g.rp) byT[t][1]++;
      var c = unitInfo(g).cluster; (byC[c] = byC[c] || [0, 0])[0]++; if (g.rp) byC[c][1]++;
    });
    // sends per day, last 14 days (one count per owner per day)
    var days = [], wa = {}, em = {};
    var base = new Date(stats.today + 'T12:00:00');
    for (var d = 13; d >= 0; d--) { var x = new Date(base); x.setDate(base.getDate() - d); days.push(x.toISOString().slice(0, 10)); }
    G.forEach(function (g) {
      var wd = {}, ed = {};
      g.rows.forEach(function (o) { if (o.wdt) wd[o.wdt] = 1; if (o.edt) ed[o.edt] = 1; });
      Object.keys(wd).forEach(function (k) { wa[k] = (wa[k] || 0) + 1; });
      Object.keys(ed).forEach(function (k) { em[k] = (em[k] || 0) + 1; });
    });
    var max = Math.max.apply(null, days.map(function (k) { return Math.max(wa[k] || 0, em[k] || 0); }).concat([1]));
    function table(obj, labels) {
      var keys = Object.keys(obj).sort(function (a, b) { return obj[b][0] - obj[a][0]; });
      if (!keys.length) return '<div class="list-note">Nothing sent yet.</div>';
      return '<table class="rtable">' + keys.map(function (k) {
        var v = obj[k], r = pct(v[1], v[0]);
        return '<tr><td>' + esc(labels && labels[k] || k) + '<div class="rbar"><i style="width:' + r + '%"></i></div></td><td>' + v[1] + ' / ' + v[0] + '</td><td><b>' + r + '%</b></td></tr>';
      }).join('') + '</table>';
    }
    $('resView').innerHTML =
      '<div class="kpis">' +
        '<div class="kpi"><b>' + contacted + '</b><span>Contacted</span></div>' +
        '<div class="kpi"><b>' + replied + '</b><span>Replied</span></div>' +
        '<div class="kpi"><b>' + pct(replied, contacted) + '%</b><span>Reply Rate</span></div>' +
      '</div>' +
      '<div class="sub" style="margin:-6px 0 6px"><span><b>' + waC + '</b> by WhatsApp</span><span><b>' + emC + '</b> by email</span></div>' +
      '<div class="eye rsec">Last 14 Days</div>' +
      '<div class="bars">' + days.map(function (k) {
        return '<div title="' + k + ': ' + (wa[k] || 0) + ' WhatsApp" style="height:' + ((wa[k] || 0) / max * 100) + '%"></div>' +
               '<div class="em" title="' + k + ': ' + (em[k] || 0) + ' email" style="height:' + ((em[k] || 0) / max * 100) + '%' + (em[k] ? '' : ';border:0') + '"></div>';
      }).join('') + '</div>' +
      '<div class="bars-x"><span>' + days[0].slice(5) + '</span><span>Today</span></div>' +
      '<div class="legend"><span><i></i>WhatsApp</span><span><i class="em"></i>Email</span></div>' +

      '<div class="list-note" style="margin-top:14px">Counts owners, not villas. A reply = <b>Mark Replied</b> pressed, or anything in the Reply column.</div>';
  }

  appStart();
</script>
</body>
</html>
